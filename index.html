
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mini Projeto Flix</title>
</head>
<body>

<h1>Sistema Flix</h1>

<button onclick="chamarEndpoint('/flix/nota-media-por-faixa-etaria?titulo=The Silent Code')">
    Nota média do filme The Silent Code por faixa etária
</button>

<button onclick="chamarEndpoint('/flix/top-filmes-por-genero?genero=DRAMA')">
    Filmes mais bem avaliados do genero drama
</button>

<button onclick="chamarEndpoint('/flix/pais-assiste-mais-filmes?titulo=The Silent Code')">
    Avaliacoes do filme The Silent Code por Pais
</button>

<hr>

<h3>Resposta da API:</h3>
<p id="resultado">Clique em um botão para chamar a API</p>

<script>
function chamarEndpoint(endpoint) {
    fetch(endpoint)
        .then(response => response.text())
        .then(data => {
            document.getElementById("resultado").innerText = data;
        })
        .catch(error => {
            document.getElementById("resultado").innerText =
                "Erro ao chamar o endpoint";
        });
}
</script>

</body>
</html>
